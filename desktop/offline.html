<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:*" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tidak ada koneksi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      background: #e8f2f4; color: #1b2a4a;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    main {
      width: min(520px, 100%); background: #fbfdfd; border: 1px solid #bcd4da; border-radius: 6px;
      box-shadow: 4px 4px 0 rgba(27, 42, 74, 0.12); overflow: hidden;
    }
    header { background: #1b2a4a; color: #f4f8fb; padding: 18px 22px; border-bottom: 4px solid #f69612; }
    header p { margin: 0 0 6px; color: #f69612; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    header h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 22px; font-weight: 600; }
    section { padding: 22px; display: grid; gap: 14px; }
    p { margin: 0; font-size: 14px; line-height: 1.6; }
    .muted { color: #526079; font-size: 13px; }
    code { display: block; padding: 8px 10px; background: #eef6f8; border: 1px dashed #93bcc5; border-radius: 4px; font-size: 13px; word-break: break-all; }
    .actions { display: flex; gap: 10px; justify-content: flex-end; }
    button {
      font: inherit; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 4px; cursor: pointer;
      border: 1px solid #8db3bc; background: #fbfdfd; color: #1b2a4a;
    }
    button.primary { background: #0c7a89; border-color: #095d69; color: #fff; }
  </style>
</head>
<body>
  <main>
    <header>
      <p>IT Rayhan Hospital</p>
      <h1>Tidak dapat terhubung</h1>
    </header>
    <section>
      <p>Aplikasi belum bisa membuka server. Periksa koneksi internet. Halaman akan dicoba lagi otomatis setiap 10 detik.</p>
      <code id="target">-</code>
      <p class="muted" id="reason"></p>
      <div class="actions">
        <button type="button" id="change">Ubah alamat</button>
        <button type="button" class="primary" id="retry">Coba lagi</button>
      </div>
    </section>
  </main>
  <script src="offline.js"></script>
</body>
</html>
